name: Update World Cup 2026 Simulation Results

on:
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/results.csv"

jobs:
  simulate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Cache CmdStan
        id: cache-cmdstan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.35.0

      - name: Install CmdStan C++ Toolchain
        if: steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: |
          uv run --with cmdstanpy python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='2.35.0')"

      - name: Load data
        if: github.event_name == 'workflow_dispatch'
        run: uv run python -c "from src.data.loader import data_pipeline; data_pipeline()"

      - name: Check if results were updated
        id: check_results
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git diff --name-only | grep -q "data/results.csv"; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Train model
        if: github.event_name == 'push' || steps.check_results.outputs.updated == 'true'
        run: uv run python -m src.simulations.train_2026

      - name: Run simulation
        if: github.event_name == 'push' || steps.check_results.outputs.updated == 'true'
        run: uv run python -m src.simulations.sim_2026

      - name: Update docs dates
        if: github.event_name == 'push' || steps.check_results.outputs.updated == 'true'
        run: uv run python -m src.output.update_dates

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "update simulation results"
            git push
          else
            echo "No changes to commit"
          fi
