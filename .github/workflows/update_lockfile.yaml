name: Update Dependency Lockfile

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python
        run: uv python install

      - name: Upgrade lockfile
        run: uv lock --upgrade

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update dependency lockfile (uv lock --upgrade)"
          title: "Update dependency lockfile"
          body: |
            Automated weekly dependency update, generated by running `uv lock --upgrade`.

            CI (lint + tests) will run automatically on this PR before it can be merged.
          branch: automated/update-lockfile
          delete-branch: true
